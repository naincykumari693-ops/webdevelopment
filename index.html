<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyNest</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="header">
        
            <h1 class="logo"><span>Daily</span><span>Nest</span></h1>
        
        

     <div class="SelectBox">
        <b>Delivery in 30 mins</b>
        
     <select>
        <option>Select location</option>
        <option>Aligarh</option>
        <option>Noida</option>
        <option>Mathura</option>
        <option>Delhi</option>
        <option>Agra</option>
     </select>
     
     </div>

     <div class="SearchBox">
        
        <input type="text" placeholder="🔍Search for products....">
     </div>
     

     
        <button class="Login">Login</button>
     
     

     <button class="cart-btn">
        🛒 My Cart
     </button>
</header>
<center>
<section class="herobanner"><img src="Kylie Skin products.jpg"
                             alt="Special offer"></section>
</center>

<section class="products-section">
   <h2>Popular products</h2>
   <div class="product-slider">
      <div class="product-card">
         <img src="Toner.jpg" alt="Toner">
         <h3>Toner</h3>
         <p>$20</p>
         <button>Add</button>
      </div>
      <div class="product-card">
         <img src="serum.jpg" alt="serum">
         <h3>serum</h3>
         <p>$30</p>
         <button>Add</button>
      </div>
      <div class="product-card">
         <img src="moisturizer.jpg" alt="moisturizer">
         <h3>moisturizer</h3>
         <p>$25</p>
         <button>Add</button>
      </div>
      <div class="product-card">
         <img src="sunscreen.jpg" alt="sunscreen">
         <h3>sunscreen</h3>
         <p>$35</p>
         <button>Add</button>
      </div>
      <div class="product-card">
         <img src="lipbalm.jpg" alt="lipbalm">
         <h3>lipbalm</h3>
         <p>$10</p>
         <button>Add</button>
      </div>
      <div class="product-card">
         <img src="Facespray.jpg" alt="Facespray">
         <h3>Facespray</h3>
         <p>$40</p>
         <button>Add</button>
      </div>
   </div>
</section>
     
    
</body>
</html>
